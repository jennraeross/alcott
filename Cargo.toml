[package]
name = "alcott"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Speed-focused local markdown writing app (TUI + CLI)"
authors = ["Alcott Contributors"]

[profile.release]
lto = true
strip = true
codegen-units = 1

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ropey = "1.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ignore = "0.4"
toml = "0.8"
chrono = "0.4"
anyhow = "1"
unicode-width = "0.1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
krilla = { version = "=0.8.2", default-features = false, features = ["simple-text", "raster-images"] }
fontdb = "=0.24.0"
